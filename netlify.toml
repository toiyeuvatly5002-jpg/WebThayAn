[build]
  command = "node tools/verify.cjs && node tools/verify-mixed.cjs && node tools/verify-tikz.cjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/node-tikzjax/css/bakoma/ttf/**", "node_modules/node-tikzjax/tex/**"]
  external_node_modules = ["firebase-admin","node-tikzjax","jsdom","opentype.js"]


